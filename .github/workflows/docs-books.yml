on:
  pull_request:
    paths:
      - "docs/lez-guide/**"
      - "docs/program-development-book/**"
      - "docs/ci/check_book_paths.py"
      - ".github/workflows/docs-books.yml"
      # The path check resolves citations against the code, so a change that
      # moves a cited file has to run it too. Without these, moving a file
      # merges green and the failure lands on the next docs pull request,
      # charged to whoever did not cause it.
      - "lee/**"
      - "lez/**"
      - "examples/**"
      - "test_programs/**"
      - "integration_tests/**"
      - "bedrock/**"

permissions:
  contents: read

name: docs-books

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Both books set create-missing = false, so a SUMMARY entry whose file is
      # missing fails here rather than silently rendering an empty page.
      - name: Build both books
        run: |
          for book in docs/lez-guide docs/program-development-book; do
            echo "::group::$book"
            mdbook build "$book"
            echo "::endgroup::"
          done

      - name: Check cited repository paths
        run: python3 docs/ci/check_book_paths.py

      # Diagrams are generated from diagrams/specs.py. Committed SVGs that no
      # longer match their spec mean a chapter is showing a stale picture.
      - name: Check diagrams reproduce from their generator
        run: |
          for book in docs/lez-guide docs/program-development-book; do
            echo "::group::$book"
            work=$(mktemp -d)
            mkdir -p "$work/src/diagrams"
            cp -r "$book/diagrams" "$work/diagrams"
            (cd "$work/diagrams" && python3 gen.py)
            diff -r "$work/src/diagrams" "$book/src/diagrams"
            echo "::endgroup::"
          done
